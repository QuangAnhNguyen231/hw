<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Interactive Photo Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="image">
        Hover over an image below to display here.
    </div>

    <div class="gallery">
        <img src="https://picsum.photos/id/10/300/200"
             alt="Mountain landscape"
             onmouseover="upDate(this)"
             onmouseout="unDo()">

        <img src="https://picsum.photos/id/20/300/200"
             alt="Forest landscape"
             onmouseover="upDate(this)"
             onmouseout="unDo()">

        <img src="https://picsum.photos/id/30/300/200"
             alt="Beautiful landscape"
             onmouseover="upDate(this)"
             onmouseout="unDo()">
    </div>

    <script src="script.js"></script>
</body>
</html>
